name: Build Windows App

on:
  workflow_dispatch:

permissions:
  contents: write   # needed so the workflow can create a Release

jobs:
  build-windows:
    name: Build Windows App
    runs-on: windows-latest
    timeout-minutes: 120

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

      # Prevent repository .Rprofile / renv from taking over.
      RENV_CONFIG_AUTOLOADER_ENABLED: "false"

    steps:

      # ======================================================
      # Checkout
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v7


      # ======================================================
      # Verify required files
      # ======================================================

      - name: Verify required repository files
        shell: powershell
        run: |
          $requiredFiles = @(
            "requirements.txt",
            "build_windows.ps1",
            "naguider_impute.R",
            "install_naguider_r_dependencies.R",
            "r_packages\GMSimpute_0.0.1.1.tar.gz",
            "r_packages\SeqKnn_1.0.1.tar.gz"
          )

          foreach ($file in $requiredFiles) {

            if (!(Test-Path $file)) {
              throw "Required file is missing: $file"
            }

            Write-Host "FOUND: $file"
          }


      # ======================================================
      # Python
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.8"
          cache: "pip"
          cache-dependency-path: requirements.txt


      # ======================================================
      # R + Rtools
      # ======================================================

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.1"
          rtools-version: "45"
          use-public-rspm: true


      # ======================================================
      # Verify R environment
      # ======================================================

      - name: Verify R and Rtools
        shell: powershell
        run: |
          Write-Host "========================================="
          Write-Host "R VERSION"
          Write-Host "========================================="

          Rscript --version

          Write-Host ""
          Write-Host "R library paths:"

          Rscript --vanilla -e "print(.libPaths())"

          Write-Host ""
          Write-Host "R_LIBS_USER:"
          Write-Host $env:R_LIBS_USER

          Write-Host ""
          Write-Host "Compiler tools:"

          Get-Command make.exe
          Get-Command gcc.exe
          Get-Command g++.exe


      # ======================================================
      # Cache R library
      #
      # New v6 key prevents restoring old broken cache.
      # ======================================================

      - name: Cache R library
        id: cache-r-lib
        uses: actions/cache@v6
        with:
          path: ${{ env.R_LIBS_USER }}
          key: windows-r-4.5.1-v6-${{ hashFiles('install_naguider_r_dependencies.R', 'r_packages/**') }}


      # ======================================================
      # Install R dependencies
      #
      # IMPORTANT:
      # Run the R script DIRECTLY.
      #
      # Do not wrap it inside a multiline:
      #
      # Rscript -e "..."
      #
      # That was the failure in the previous workflow.
      # ======================================================

      - name: Install NAguideR R dependencies
        shell: powershell
        run: |
          Write-Host "========================================="
          Write-Host "Installing R dependencies"
          Write-Host "========================================="

          Write-Host "R_LIBS_USER:"
          Write-Host $env:R_LIBS_USER

          Write-Host ""
          Write-Host "Running install_naguider_r_dependencies.R..."
          Write-Host ""

          & Rscript --vanilla install_naguider_r_dependencies.R

          if ($LASTEXITCODE -ne 0) {
            throw "R dependency installation failed with exit code $LASTEXITCODE"
          }

          Write-Host ""
          Write-Host "R dependency installer completed."


      # ======================================================
      # Verify ALL required R packages
      # ======================================================

      - name: Verify required R packages
        shell: powershell
        run: |
          Write-Host "========================================="
          Write-Host "R PACKAGE VALIDATION"
          Write-Host "========================================="

          Rscript --vanilla -e "pkgs <- c('NAguideR','e1071','impute','SeqKnn','pcaMethods','norm','imputeLCMD','VIM','rrcovNA','mice','missForest','GMSimpute','DreamAI','glmnet','ggplot2','reshape2','randomForest','foreach','itertools','iterators','Rcpp','shiny','shinyBS','shinyjs','shinyWidgets','DT','gdata','ggsci','openxlsx','data.table','tidyverse','ggExtra','cowplot','Amelia'); failed <- character(); for (p in pkgs) { ok <- tryCatch({loadNamespace(p); TRUE}, error=function(e) {cat(sprintf('%-20s LOAD ERROR: %s\n', p, conditionMessage(e))); FALSE}); if (ok) cat(sprintf('%-20s OK [%s]\n', p, as.character(packageVersion(p)))) else failed <- c(failed,p) }; if (length(failed)) stop(paste('R validation failed:', paste(failed, collapse=', '))); cat('\nALL REQUIRED R PACKAGES OK\n')"


      # ======================================================
      # Stage bundled R
      #
      # Creates:
      #
      # r_bundle/R
      # r_bundle/library
      #
      # These are used by build_windows.ps1.
      # ======================================================

      - name: Stage bundled R runtime
        shell: powershell
        run: |
          Write-Host "========================================="
          Write-Host "STAGING R RUNTIME"
          Write-Host "========================================="

          $ROOT = (Get-Location).Path

          $RHOME = (
            & Rscript --vanilla -e "cat(R.home())"
          ).Trim()

          $RLIB = (
            & Rscript --vanilla -e "cat(.libPaths()[1])"
          ).Trim()

          Write-Host "R_HOME:"
          Write-Host $RHOME

          Write-Host ""
          Write-Host "R library:"
          Write-Host $RLIB

          if (!(Test-Path $RHOME)) {
            throw "R_HOME does not exist: $RHOME"
          }

          if (!(Test-Path $RLIB)) {
            throw "R library does not exist: $RLIB"
          }

          Remove-Item `
            -Recurse `
            -Force `
            "$ROOT\r_bundle" `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Force `
            "$ROOT\r_bundle\R" |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            "$ROOT\r_bundle\library" |
            Out-Null

          Write-Host ""
          Write-Host "Copying R runtime..."

          Copy-Item `
            -Recurse `
            -Force `
            "$RHOME\*" `
            "$ROOT\r_bundle\R\"

          Write-Host ""
          Write-Host "Copying R package library..."

          Copy-Item `
            -Recurse `
            -Force `
            "$RLIB\*" `
            "$ROOT\r_bundle\library\"


          # --------------------------------------------------
          # Verify Rscript
          # --------------------------------------------------

          $rscript = Get-ChildItem `
            -Recurse `
            "$ROOT\r_bundle\R" `
            -Filter "Rscript.exe" |
            Select-Object -First 1

          if (!$rscript) {
            throw "Rscript.exe was not copied into r_bundle."
          }

          Write-Host ""
          Write-Host "Bundled Rscript:"
          Write-Host $rscript.FullName


          # --------------------------------------------------
          # Verify important packages were staged
          # --------------------------------------------------

          $requiredPackages = @(
            "NAguideR",
            "SeqKnn",
            "GMSimpute",
            "DreamAI",
            "missForest"
          )

          foreach ($pkg in $requiredPackages) {

            $pkgPath = Join-Path `
              "$ROOT\r_bundle\library" `
              $pkg

            if (!(Test-Path $pkgPath)) {
              throw "Package was installed but was not staged: $pkg"
            }

            Write-Host "STAGED: $pkg"
          }


      # ======================================================
      # Python dependencies
      # ======================================================

      - name: Install Python dependencies
        shell: powershell
        run: |
          Write-Host "========================================="
          Write-Host "PYTHON DEPENDENCIES"
          Write-Host "========================================="

          python -m pip install --upgrade pip setuptools wheel

          python -m pip install -r requirements.txt

          python -m pip install streamlit-desktop-app pyinstaller


      # ======================================================
      # Verify Python build tools
      # ======================================================

      - name: Verify Python build tools
        shell: powershell
        run: |
          Write-Host "========================================="
          Write-Host "PYTHON BUILD TOOLS"
          Write-Host "========================================="

          python --version

          python -m PyInstaller --version

          python -m pip show streamlit

          python -m pip show streamlit-desktop-app

          python -m pip show pyinstaller


      # ======================================================
      # Build Windows app
      # ======================================================

      - name: Build Windows app
        shell: powershell
        run: |
          Write-Host "========================================="
          Write-Host "BUILDING WINDOWS APPLICATION"
          Write-Host "========================================="

          Set-ExecutionPolicy `
            -ExecutionPolicy Bypass `
            -Scope Process `
            -Force

          .\build_windows.ps1


      # ======================================================
      # Verify build output
      # ======================================================

      - name: Verify build output
        shell: powershell
        run: |
          Write-Host "========================================="
          Write-Host "VERIFY BUILD OUTPUT"
          Write-Host "========================================="

          if (!(Test-Path "dist\ProteomicsWorkbench")) {

            Write-Host "Contents of dist:"

            if (Test-Path "dist") {

              Get-ChildItem `
                -Recurse `
                "dist" |
                Select-Object FullName, Length |
                Format-Table -AutoSize
            }

            throw "Expected application directory dist\ProteomicsWorkbench was not created."
          }

          Write-Host ""
          Write-Host "Application created successfully."

          Get-ChildItem `
            -Recurse `
            "dist\ProteomicsWorkbench" |
            Select-Object FullName, Length |
            Format-Table -AutoSize


      # ======================================================
      # Verify R inside final application
      # ======================================================

      - name: Verify bundled R in application
        shell: powershell
        run: |
          Write-Host "========================================="
          Write-Host "VERIFY BUNDLED R"
          Write-Host "========================================="

          $rscript = Get-ChildItem `
            -Path "dist\ProteomicsWorkbench" `
            -Recurse `
            -Filter "Rscript.exe" `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (!$rscript) {
            throw "Rscript.exe was not found inside dist\ProteomicsWorkbench."
          }

          Write-Host "Bundled Rscript:"
          Write-Host $rscript.FullName


      # ======================================================
      # ZIP
      # ======================================================

      - name: Zip Windows app
        shell: powershell
        run: |
          Write-Host "========================================="
          Write-Host "CREATING ZIP"
          Write-Host "========================================="

          $APP_DIR = "dist\ProteomicsWorkbench"

          $ZIP = "ProteomicsWorkbench-Windows.zip"

          if (!(Test-Path $APP_DIR)) {
            throw "Application directory does not exist: $APP_DIR"
          }

          if (Test-Path $ZIP) {
            Remove-Item -Force $ZIP
          }

          Compress-Archive `
            -Path "$APP_DIR\*" `
            -DestinationPath $ZIP `
            -Force

          if (!(Test-Path $ZIP)) {
            throw "ZIP file was not created."
          }

          Write-Host ""
          Write-Host "Created:"

          Get-Item $ZIP |
            Select-Object Name, Length |
            Format-Table -AutoSize


      # ======================================================
      # Upload
      # ======================================================

      - name: Upload Windows app
        uses: actions/upload-artifact@v6
        with:
          name: ProteomicsWorkbench-Windows
          path: ProteomicsWorkbench-Windows.zip
          if-no-files-found: error
          retention-days: 90


      # ======================================================
      # Publish to GitHub Releases
      #
      # Artifacts expire and need a GitHub login to download.
      # A Release is permanent and shows on the repo home page.
      # ======================================================

      - name: Publish to GitHub Releases
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ZIP = "ProteomicsWorkbench-Windows.zip"
          $size = (Get-Item $ZIP).Length

          # GitHub Release files must be under 2 GiB each
          if ($size -ge 2GB) {
            throw "ZIP is $([math]::Round($size/1GB,2)) GB. GitHub Releases allow max 2 GB per file."
          }

          $TAG = "v1.0.${{ github.run_number }}"

          gh release create $TAG $ZIP `
            --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" `
            --title "Proteomics Workbench $TAG (Windows)" `
            --notes "Windows build from commit ${{ github.sha }}. Download the ZIP, unzip it, then run ProteomicsWorkbench.exe inside the folder. Keep all files together."

          if ($LASTEXITCODE -ne 0) {
            throw "Release creation failed with exit code $LASTEXITCODE"
          }