name: Build Windows App

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90   # Hard cap. Prevents a stuck install.packages() call from
                           # burning the default 6-hour job timeout.

    steps:

      # ============================================================
      # Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v6


      # ============================================================
      # Python
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.8"
          cache: "pip"


      # ============================================================
      # R
      # ============================================================
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.1"
          use-public-rspm: true


      # ============================================================
      # Verify files needed for NAguideR
      # ============================================================
      - name: Verify R source files
        shell: powershell
        run: |
          $requiredFiles = @(
            "naguider_impute.R",
            "install_naguider_r_dependencies.R",
            "r_packages\GMSimpute_0.0.1.1.tar.gz",
            "r_packages\SeqKnn_1.0.1.tar.gz"
          )

          foreach ($file in $requiredFiles) {
            if (!(Test-Path $file)) {
              throw "Required R file is missing: $file"
            }
            Write-Host "Found: $file"
          }


      # ============================================================
      # Show R / compiler information
      #
      # Diagnostic only. Compiler discovery is wrapped so a missing
      # gcc/make on PATH logs a warning instead of failing the whole
      # job on a non-zero exit code.
      # ============================================================
      - name: Show R environment
        shell: powershell
        run: |
          Write-Host "R:"
          Get-Command R

          Write-Host "Rscript:"
          Get-Command Rscript

          Rscript --version

          Rscript -e "cat('R_HOME=', R.home(), '\n'); cat('Libraries:\n'); print(.libPaths())"

          Write-Host "Compiler (diagnostic only, non-fatal):"
          $gcc = Get-Command gcc.exe -ErrorAction SilentlyContinue
          if ($gcc) { Write-Host "gcc found: $($gcc.Source)" } else { Write-Warning "gcc not found on PATH" }

          $make = Get-Command make.exe -ErrorAction SilentlyContinue
          if ($make) { Write-Host "make found: $($make.Source)" } else { Write-Warning "make not found on PATH" }


      # ============================================================
      # Cache the R package library
      #
      # Keyed on the R version, the dependency-install script, and
      # the two vendored tarballs. Bump any of those and the cache
      # invalidates automatically.
      # ============================================================
      - name: Cache R library
        id: cache-r-lib
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.R_LIBS_USER }}
          key: >-
            windows-r-4.5.1-lib-
            ${{ hashFiles('install_naguider_r_dependencies.R') }}-
            ${{ hashFiles('r_packages/**') }}


      # ============================================================
      # Install R / NAguideR dependencies
      #
      # Single source of truth: this calls the same script used
      # outside CI, instead of re-declaring the package list here.
      # If you update install_naguider_r_dependencies.R, this build
      # picks the change up automatically.
      #
      # NOTE: this intentionally does not use renv, even though the
      # repo has a renv.lock, because of the custom tarball / GitHub
      # sources below. That means package versions installed here
      # can drift from what renv.lock pins for local dev. If that
      # matters, pin the CRAN/Bioc versions explicitly to match
      # renv.lock rather than letting install.packages() take
      # whatever is current on build day.
      # ============================================================
      - name: Install NAguideR R dependencies
        shell: Rscript {0}
        run: |
          options(repos = c(CRAN = "https://cloud.r-project.org"))
          options(Ncpus = 2)
          source("install_naguider_r_dependencies.R")


      # ============================================================
      # Install additional R packages used only by this app's UI
      #
      # These are NOT part of install_naguider_r_dependencies.R —
      # kept separate on purpose so that script stays the single
      # source of truth for the NAguideR-specific dependency set.
      # ============================================================
      - name: Install additional Shiny/UI R packages
        shell: Rscript {0}
        run: |
          options(repos = c(CRAN = "https://cloud.r-project.org"))
          options(Ncpus = 2)

          ui_packages <- c(
            "shiny",
            "shinyBS",
            "shinyjs",
            "shinyWidgets",
            "DT",
            "gdata",
            "ggplot2",
            "ggsci",
            "openxlsx",
            "data.table",
            "tidyverse",
            "ggExtra",
            "cowplot",
            "Amelia"
          )

          for (pkg in ui_packages) {
            if (!requireNamespace(pkg, quietly = TRUE)) {
              cat("\nInstalling:", pkg, "\n")
              install.packages(pkg, dependencies = TRUE)
            }
          }


      # ============================================================
      # Final validation in a clean R process
      # ============================================================
      - name: Verify R / NAguideR
        shell: powershell
        run: |
          Rscript --version

          Rscript -e "
          pkgs <- c(
            'NAguideR', 'e1071', 'impute', 'SeqKnn', 'pcaMethods',
            'norm', 'imputeLCMD', 'VIM', 'rrcovNA', 'mice',
            'missForest', 'GMSimpute', 'DreamAI',
            'shiny', 'DT', 'tidyverse'
          );

          failed <- character();
          for (p in pkgs) {
            ok <- requireNamespace(p, quietly = TRUE);
            cat(sprintf('%-15s %s\n', p, if (ok) 'OK' else 'MISSING'));
            if (!ok) failed <- c(failed, p);
          }

          if (length(failed) > 0)
            stop(paste('Missing R packages:', paste(failed, collapse=', ')));
          "


      # ============================================================
      # Stage R runtime for PyInstaller
      # ============================================================
      - name: Stage bundled R runtime
        shell: powershell
        run: |
          $ROOT = (Get-Location).Path

          $RHOME = (& Rscript -e "cat(R.home())").Trim()
          $RLIB  = (& Rscript -e "cat(.libPaths()[1])").Trim()

          Write-Host "Repository root: $ROOT"
          Write-Host "R_HOME: $RHOME"
          Write-Host "R library: $RLIB"

          if (!(Test-Path $RHOME)) { throw "R_HOME does not exist: $RHOME" }
          if (!(Test-Path $RLIB))  { throw "R package library does not exist: $RLIB" }

          Remove-Item -Recurse -Force "$ROOT\r_bundle" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$ROOT\r_bundle\R" | Out-Null
          New-Item -ItemType Directory -Force "$ROOT\r_bundle\library" | Out-Null

          Write-Host "Copying R runtime..."
          Copy-Item -Recurse -Force "$RHOME\*" "$ROOT\r_bundle\R\"

          Write-Host "Copying R package library..."
          Copy-Item -Recurse -Force "$RLIB\*" "$ROOT\r_bundle\library\"

          $rscriptFiles = Get-ChildItem -Recurse "$ROOT\r_bundle\R" -Filter "Rscript.exe"
          if (!$rscriptFiles) { throw "Rscript.exe was not copied into the bundled R runtime." }

          $requiredPackages = @("NAguideR", "SeqKnn", "GMSimpute", "DreamAI", "missForest")
          foreach ($pkg in $requiredPackages) {
            $pkgPath = Join-Path "$ROOT\r_bundle\library" $pkg
            if (!(Test-Path $pkgPath)) { throw "Package was installed but was not staged: $pkg" }
            Write-Host "Staged package OK: $pkg"
          }


      # ============================================================
      # Repository check
      # ============================================================
      - name: Show repository contents
        shell: powershell
        run: |
          Get-ChildItem -Force | Select-Object Name, Mode, Length | Format-Table -AutoSize

          if (Test-Path "r_packages") {
            Get-ChildItem -Recurse "r_packages" | Select-Object FullName, Length | Format-Table -AutoSize
          } else {
            throw "r_packages directory is missing."
          }

          # KNOWN ISSUE TO CONFIRM BEFORE RELYING ON THIS BUILD:
          # Repo contains app_launcher_FIIE.py, but build_windows.ps1
          # hidden-imports "app_launcher_FILE" / "faq.faq_FILE".
          # If the app dynamically loads this module by name at runtime,
          # the mismatched spelling means it can be silently dropped
          # from the frozen exe. Confirm which spelling is correct
          # (rename the file or fix build_windows.ps1) before shipping.
          if (Test-Path "app_launcher_FIIE.py") {
            Write-Warning "app_launcher_FIIE.py exists but build_windows.ps1 hidden-imports 'app_launcher_FILE'. Verify this is intentional."
          }


      # ============================================================
      # Python dependencies
      # ============================================================
      - name: Install Python dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install streamlit-desktop-app pyinstaller


      # ============================================================
      # Build
      # ============================================================
      - name: Build Windows app
        shell: powershell
        run: |
          .\build_windows.ps1


      # ============================================================
      # Verify build
      # ============================================================
      - name: Show build output
        shell: powershell
        run: |
          if (!(Test-Path "dist")) { throw "dist directory does not exist." }
          Get-ChildItem -Recurse dist | Select-Object FullName, Length | Format-Table -AutoSize


      # ============================================================
      # ZIP
      # ============================================================
      - name: Zip Windows app
        shell: powershell
        run: |
          $APP_DIR = "dist\ProteomicsWorkbench"

          if (!(Test-Path $APP_DIR)) {
            throw "Could not find: $APP_DIR. The R-enabled Windows application should be built using PyInstaller --onedir."
          }

          Compress-Archive -Path "$APP_DIR\*" -DestinationPath "ProteomicsWorkbench-Windows.zip" -Force

          if (!(Test-Path "ProteomicsWorkbench-Windows.zip")) {
            throw "ZIP file was not created."
          }

          Get-Item "ProteomicsWorkbench-Windows.zip" | Select-Object Name, Length | Format-Table -AutoSize


      # ============================================================
      # Upload
      # ============================================================
      - name: Upload Windows app
        uses: actions/upload-artifact@v6
        with:
          name: ProteomicsWorkbench-Windows
          path: ProteomicsWorkbench-Windows.zip
          if-no-files-found: error
          retention-days: 14
