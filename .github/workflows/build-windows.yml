name: Build Windows App

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.8"

      - name: Show repository contents
        shell: powershell
        run: |
          Write-Host "Current directory:"
          Get-Location
          Write-Host "Top-level repository files:"
          Get-ChildItem -Force | Select-Object Name, Mode, Length | Format-Table -AutoSize
          Write-Host "Assets folder:"
          if (Test-Path "assets") { Get-ChildItem -Recurse assets | Select-Object FullName, Length | Format-Table -AutoSize } else { Write-Host "assets folder is missing" }

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install streamlit-desktop-app pyinstaller

      - name: Build Windows app
        shell: powershell
        run: |
          .\build_windows.ps1

      - name: Show build output
        shell: powershell
        run: |
          Write-Host "Listing dist folder:"
          Get-ChildItem -Recurse dist

      - name: Zip Windows app
        shell: powershell
        run: |
          if (Test-Path "dist\ProteomicsWorkbench.exe") {
            Compress-Archive -Path "dist\ProteomicsWorkbench.exe" -DestinationPath "ProteomicsWorkbench-Windows.zip" -Force
          }
          elseif (Test-Path "dist\ProteomicsWorkbench") {
            Compress-Archive -Path "dist\ProteomicsWorkbench\*" -DestinationPath "ProteomicsWorkbench-Windows.zip" -Force
          }
          else {
            Write-Error "Could not find ProteomicsWorkbench build output in dist."
          }

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: ProteomicsWorkbench-Windows
          path: ProteomicsWorkbench-Windows.zip
