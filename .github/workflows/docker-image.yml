name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: sbaheti84/proteomics-data-explorer-workbench

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 1024

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Show repository contents
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================"
          echo "Repository"
          echo "============================================"

          pwd
          echo

          echo "Git commit:"
          git rev-parse HEAD
          echo

          echo "Top-level files:"
          ls -lah

      - name: Verify Docker build inputs
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_FILES=(
            "Dockerfile"
            ".dockerignore"
            "requirements.txt"
            "app.py"
            "naguider_impute.R"
            "install_naguider_r_dependencies.R"
            "r_packages/GMSimpute_0.0.1.1.tar.gz"
            "r_packages/SeqKnn_1.0.1.tar.gz"
          )

          echo "============================================"
          echo "Checking Docker build inputs"
          echo "============================================"

          for file in "${REQUIRED_FILES[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "ERROR: Required file is missing: $file"
              echo
              echo "Repository files:"
              find . -maxdepth 3 -type f | sort
              exit 1
            fi

            echo "FOUND: $file"
          done

          echo
          echo "R package archives:"
          ls -lh r_packages/

      - name: Check Dockerfile ending
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================"
          echo "Dockerfile final lines"
          echo "============================================"

          tail -n 20 Dockerfile

          if ! grep -q '^CMD \["streamlit"' Dockerfile; then
            echo
            echo "ERROR: Expected one-line JSON CMD for Streamlit was not found."
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Show Docker environment
        shell: bash
        run: |
          set -euo pipefail

          echo "Docker:"
          docker version

          echo
          echo "Buildx:"
          docker buildx version

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

          labels: |
            org.opencontainers.image.title=Proteomics Data Explorer Workbench
            org.opencontainers.image.description=Streamlit proteomics workbench with R and NAguideR support
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Show Docker metadata
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================"
          echo "Docker metadata"
          echo "============================================"

          echo "Image:"
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          echo
          echo "Tags:"
          echo "${{ steps.meta.outputs.tags }}"

      - name: Build and publish Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile

          platforms: linux/amd64,linux/arm64

          pull: true

          push: ${{ github.event_name != 'pull_request' }}

          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show build result
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================"
          echo "Docker build completed"
          echo "============================================"

          echo "Image:"
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          echo
          echo "Digest:"
          echo "${{ steps.build.outputs.digest }}"

          echo
          echo "Tags:"
          echo "${{ steps.meta.outputs.tags }}"

      - name: Show published image
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================"
          echo "Docker image published to GHCR"
          echo "============================================"

          echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          echo
          echo "Pull latest with:"
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"