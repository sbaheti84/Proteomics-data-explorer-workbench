name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

  # Keep this LOWERCASE because Docker image names must be lowercase.
  IMAGE_NAME: sbaheti84/proteomics-data-explorer-workbench


jobs:

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ---------------------------------------------------------
      # Configure Docker Buildx
      # ---------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ---------------------------------------------------------
      # Login to GitHub Container Registry
      #
      # Do NOT login for pull requests because PR builds should
      # only test the image, not publish it.
      # ---------------------------------------------------------
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ---------------------------------------------------------
      # Generate useful Docker tags and labels
      #
      # Examples:
      #
      # main:
      #   ghcr.io/.../proteomics-data-explorer-workbench:latest
      #   ghcr.io/.../proteomics-data-explorer-workbench:main
      #   ghcr.io/.../proteomics-data-explorer-workbench:sha-abc1234
      #
      # git tag v1.0.0:
      #   ghcr.io/.../proteomics-data-explorer-workbench:1.0.0
      #   ghcr.io/.../proteomics-data-explorer-workbench:1.0
      # ---------------------------------------------------------
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}


      # ---------------------------------------------------------
      # Build image
      #
      # PR:
      #   Build only. Do NOT publish.
      #
      # main/tag:
      #   Build AND publish to GHCR.
      #
      # For now use linux/amd64 because your Mayo/server
      # environment is x86-64 and this is simpler for R packages.
      # ---------------------------------------------------------
      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile

          platforms: linux/amd64

          push: ${{ github.event_name != 'pull_request' }}

          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          cache-from: type=gha
          cache-to: type=gha,mode=max


      # ---------------------------------------------------------
      # Display resulting image name
      # ---------------------------------------------------------
      - name: Show published image
        if: github.event_name != 'pull_request'
        run: |
          echo "Docker image published:"
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
